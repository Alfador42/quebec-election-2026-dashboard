name: Daily polling discovery and build
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quebec-polling-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Inclusive Toronto election-day guard
        id: calendar
        run: |
          node --input-type=module -e "import {localDay,frozen} from './pipeline/core.mjs';import fs from 'node:fs';fs.appendFileSync(process.env.GITHUB_OUTPUT, 'active='+!frozen(localDay())+'\n');"
      - run: npm ci
        if: steps.calendar.outputs.active == 'true'
      - run: npm test
        if: steps.calendar.outputs.active == 'true'
      - name: Discover sources, preserve failures, recalculate dataset
        if: steps.calendar.outputs.active == 'true'
        run: npm run update
      - run: npm run build
        if: steps.calendar.outputs.active == 'true'
      - name: Store updated evidence and derived data
        if: steps.calendar.outputs.active == 'true'
        run: |
          git config user.name "Québec polling updater"
          git config user.email "polling-updater@users.noreply.github.com"
          git add data public/data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Québec polling discovery and averages"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.calendar.outputs.active == 'true'
        with:
          name: polling-update-evidence-and-build
          path: |
            data/state.json
            public/data/dashboard.json
            dist
          retention-days: 30
